[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cruise-ai"
version = "0.1.0"
description = "Self-driven AI developer coaching. Zero effort, maximum signal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
authors = [{name = "Jimit Shah", email = "jimit24365@gmail.com"}]
keywords = ["ai", "developer-tools", "coaching", "productivity", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/jimit24365/cruise-ai"
Repository = "https://github.com/jimit24365/cruise-ai"
Issues = "https://github.com/jimit24365/cruise-ai/issues"
Documentation = "https://github.com/jimit24365/cruise-ai/tree/main/docs"
Changelog = "https://github.com/jimit24365/cruise-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.10", "pytest>=8", "pytest-cov>=5", "pre-commit>=3"]

[project.scripts]
cruise-ai = "cruise_ai.build_profile:main"

[tool.setuptools.packages.find]
include = ["cruise_ai*"]

[tool.setuptools.package-data]
cruise_ai = ["static/**/*", "docs/**/*", "examples/**/*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--cov=cruise_ai.scoring --cov=cruise_ai.scanner --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
